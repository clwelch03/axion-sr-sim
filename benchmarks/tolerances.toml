# Relative tolerances of the regression check, by quantity class (see quantities.jl for the measure).
# `floor` is the largest relative difference found by noise_floor.jl over all four states and the
# variations that apply to the tier; `tolerance` (the `relative` key) is a modest factor above it, with a
# lower limit of 1e-12 (the evaluation tier's minimum: reordered sums change results at about 1e-16
# relative before any amplification). Tier "evaluation": pure evaluations at the stored unknown vector;
# floor from the roundoff_input and blas_threads variations. Tier "resolve": quantities after
# solve_radial or the evolution; floor from the solver_path variation (and roundoff_input). The README has the table
# with the quantities behind each floor.

[class.exact]
tier = "evaluation"
relative = 0.0
floor = 0.0

[class.charge]
tier = "evaluation"
relative = 1e-12
floor = 4.2e-16

[class.derivative]
tier = "evaluation"
relative = 3e-6
floor = 3.1e-7      # explicit part is a central difference with relative step 1e-6, which amplifies input roundoff

[class.jacobian]
tier = "evaluation"
relative = 3e-10
floor = 2.4e-11

[class.residual]
tier = "evaluation"
relative = 3e-10
floor = 2.3e-11

[class.residual_converged]
tier = "evaluation"
relative = 1e-11
floor = 4.2e-13     # anchored on the displaced residual

[class.response]
tier = "evaluation"
relative = 3e-10
floor = 2.3e-11

[class.loss]
tier = "evaluation"
relative = 1e-9
floor = 6.3e-11     # anchored on the size of the fluxes or work terms

[class.rate]
tier = "evaluation"
relative = 3e-11
floor = 2.2e-12     # anchored on the size of the inputs of the solve

[class.rate_background]
tier = "evaluation"
relative = 1e-12
floor = 1.4e-15

[class.solve_frequency]
tier = "resolve"
relative = 1e-12
floor = 1.1e-14

[class.solve_unknown]
tier = "resolve"
relative = 1e-12
floor = 2.9e-14

[class.solve_charge]
tier = "resolve"
relative = 1e-11
floor = 1.2e-12

[class.trajectory_amplitude]
tier = "resolve"
relative = 1e-7
floor = 1.1e-8      # the integrator's own reltol is 1e-7

[class.trajectory_background]
tier = "resolve"
relative = 1e-11
floor = 2.5e-13

[class.trajectory_time]
tier = "resolve"
relative = 3e-7
floor = 2.7e-8

[class.reported]
tier = "reported"
relative = inf      # iteration and right-hand-side counts are printed, never asserted
floor = 0.2
