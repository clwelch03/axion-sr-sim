[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axion-sr-sim"
version = "0.1.0"
description = "Time-domain and adiabatic reproductions of axion superradiance on Kerr"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "mpmath", "matplotlib"]

# Installable packages; PYTHONPATH=src also supports running from a checkout.
[tool.setuptools.packages.find]
where = ["src"]
include = ["dolan*", "adiabatic*", "common*"]

[tool.setuptools.package-data]
dolan = ["*.jl"]
adiabatic = ["*.jl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
